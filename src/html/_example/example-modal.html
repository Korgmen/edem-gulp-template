<!doctype html>
<html lang="ru">
	@@include('../chunks/head.html', {title: 'Примеры: Модальные окна', example: true})

	<body class="page">
		<div class="wrapper">
			@@include('../chunks/header.html')
			<main class="content example">
				<div class="container">
					<a class="example__back link" href="example.html">← Все примеры</a>
				</div>
				<section class="content__block">
					<div class="container appear">
						<h2 class="example__title"><span>Пример модалов</span></h2>
						<div class="example__row example__row--dense">
							<button type="button" class="modal-link button" data-modal-open="callback">
								Вызвать модал callback
							</button>
						</div>
					</div>
				</section>
			</main>
			@@include('../chunks/footer.html')
		</div>
		@@include('../chunks/modals.html')
		<dialog id="callback" class="modal" data-modal>
			<form class="modal__close" method="dialog">
				<button aria-label="Закрыть">
					<svg aria-hidden="true" focusable="false" class="modal__close-icon icon" width="32" height="32">
						<use href="img/sprite.svg#close"></use>
					</svg>
				</button>
			</form>
			<div class="modal__content" data-modal-content>Модальное окно "callback"</div>
		</dialog>
		@@include('../chunks/scripts.html', {example: true})
	</body>
</html>
