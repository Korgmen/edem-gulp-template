<!DOCTYPE html>
<html lang="ru">

	@@include('../chunks/head.html', {title: 'Примеры: Бургер', example: true})

	<body class="page">
		<div class="wrapper">
			@@include('../chunks/header.html')
			<main class="content example">
				<div class="container">
					<a class="example__back link" href="example.html">← Все примеры</a>
				</div>
				<section class="content__block">
					<div class="container appear">
						<h2 class="example__title"><span>Пример бургера</span></h2>
						<script>
							const toggleBurger = () => {
								document.querySelectorAll('[data-burger][aria-expanded]').forEach(burger => {
									burger.setAttribute('aria-expanded', burger.getAttribute('aria-expanded') !== 'true');
								});
							}
						</script>
						<button type="button" class="example__button button" onclick="toggleBurger()">Переключить бургер</button>
						<div class="example__row">
							<button type="button" class="burger-icon" data-burger aria-expanded="false" aria-label="Открыть меню"><span></span></button>
							<button type="button" class="burger-icon" data-burger aria-expanded="false" aria-label="Открыть меню"><span></span></button>
						</div>
					</div>
				</section>
			</main>
			@@include('../chunks/footer.html')
		</div>
		@@include('../chunks/modals.html')
		@@include('../chunks/scripts.html', {example: true})
	</body>

</html>
