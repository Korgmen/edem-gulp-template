name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Версия pnpm берётся из поля packageManager в package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm build:stage

      - name: Сборка форка без демо и примеров
        run: |
          pnpm run demo:remove --yes
          pnpm run example:remove --yes
          pnpm build
